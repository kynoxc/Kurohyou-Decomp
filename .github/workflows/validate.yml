name: validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project metadata
        run: |
          python -m py_compile tools/*.py tools/kurohyou/*.py
          python tools/progress.py
          python tools/generate_decompdev_report.py
